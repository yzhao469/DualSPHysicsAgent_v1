[project]
name = "dualsphysics-maf"
version = "0.1.0"
description = "LLM-assisted workflow for DualSPHysics non-Newtonian simulations"
requires-python = ">=3.12"
dependencies = [
    "agent-framework==1.0.0rc3",
    "agent-framework-anthropic>=1.0.0b260219",
    "mcp[fastmcp]>=1.0,<2",
    "anthropic>=0.80,<1",
    "openai>=2.0,<3",
    "pandas>=2.0,<4",
    "numpy>=2.0,<3",
    "jinja2>=3.1,<4",
    "pydantic>=2.0,<3",
    "pyvista>=0.44,<1",
    "matplotlib>=3.9,<4",
    "python-dotenv>=1.0,<2",
    "opentelemetry-semantic-conventions-ai==0.4.13",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4,<9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "main_smoke", "gui_api"]

[tool.setuptools.packages.find]
include = ["agents*", "mcp_server*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: fast, isolated tests for pure helpers and local file transformations",
    "integration: tests that require MCP, external binaries, or live services",
]
